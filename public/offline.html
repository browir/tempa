<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F6F4F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
    <title>Offline · Tempa</title>
    <style>
        :root { --paper: #f6f4f0; --ink: #1a1714; --muted: #6e6861; --accent: #c2410c; --accent-fg: #fff; color-scheme: light; }
        @media (prefers-color-scheme: dark) {
            :root { --paper: #121110; --ink: #efebe6; --muted: #938b82; --accent: #f2884b; --accent-fg: #1c0f06; color-scheme: dark; }
        }
        * { box-sizing: border-box; touch-action: pan-x pan-y; }
        body {
            margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: var(--paper); color: var(--ink);
            font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        main { max-width: 320px; text-align: center; }
        svg { width: 40px; height: 40px; color: var(--muted); margin-bottom: 12px; }
        h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: -0.01em; }
        p { margin: 0 0 20px; color: var(--muted); }
        button {
            height: 48px; padding: 0 22px; border: 0; border-radius: 12px; cursor: pointer;
            background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M5 12.86a10 10 0 0 1 5.17-2.69M19 12.86a10 10 0 0 0-2.01-1.5M2 8.82a15 15 0 0 1 4.18-2.65M22 8.82a15 15 0 0 0-11.29-3.76M2 2l20 20" />
        </svg>
        <h1>Sedang offline</h1>
        <p>Halaman ini belum pernah dibuka saat online, jadi belum tersimpan di HP. Sambungkan internet lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
        addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
